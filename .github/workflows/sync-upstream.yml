name: Sync upstream

# 上游 sogud/mygo-music-netease 有更新时，自动把新代码合进融合版。
#
# 触发：每天定时 + 手动（Actions 页面点 Run workflow）。
# 行为：git fetch upstream → 若有新提交则 merge → 推回本仓库。
# 冲突：自动合并失败时，把冲突留在分支并创建 issue 提醒手动处理。

on:
  schedule:
    # 每天 UTC 00:30（北京时间 08:30）跑一次
    - cron: "30 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add upstream
        run: |
          git remote add upstream https://github.com/sogud/mygo-music-netease.git || true
          git fetch upstream main

      - name: Check for new commits
        id: check
        run: |
          BEHIND=$(git rev-list --count HEAD..upstream/main || echo 0)
          echo "behind=$BEHIND" >> "$GITHUB_OUTPUT"
          echo "上游落后 $BEHIND 个提交"

      - name: Merge upstream
        if: steps.check.outputs.behind != '0'
        id: merge
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git merge upstream/main --no-edit -m "chore: sync upstream"

      - name: Push if merged cleanly
        if: steps.merge.outcome == 'success'
        run: git push origin HEAD:main

      - name: Open issue on conflict
        if: steps.merge.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "上游合并冲突，需手动处理",
              body: "上游 sogud/mygo-music-netease 有新提交，但自动合并失败（通常是 plugin.json 的 name/version，或 stream()/lyrics() 冲突）。\n\n处理步骤见仓库根目录 SYNC_UPSTREAM.md：\n1. `git fetch upstream && git merge upstream/main`\n2. 解决冲突：plugin.json 保留我们的 name/version；解灰相关保留我们的；纯新增功能采用上游。\n3. 检查 .mgg 拒绝、无损码率 kbps 两处修复是否被改回。\n4. 回归 + 提交。",
            });
